name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  change-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Change gate (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          python scripts/check_change_gate.py --base origin/${{ github.base_ref }}
      - name: Change gate (push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          else
            BASE="$BEFORE"
          fi
          python scripts/check_change_gate.py --base "$BASE"

  e2e:
    runs-on: ubuntu-latest
    needs: change-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps
      - name: E2E (offline scales)
        run: python -m pytest tests/e2e/offline_scales -v -m e2e
