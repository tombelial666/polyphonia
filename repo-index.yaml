    layer: runtime
    status: authoritative-runtime-data
    role: asset-root
    description: Flat legacy frontend asset bundle.
  - path: assets/all_instruments.js
    layer: runtime
    status: authoritative-readable-registry
    role: instrument-registry
    description: Readable instrument registry across supported instruments.
  - path: assets/_piano_html.txt
    layer: runtime
    status: authoritative-build-input
    role: piano-fragment
    description: HTML fragment inserted into generated page.
  - path: assets/chords-logo.png
