version: 1
project:
  name: PETS
  root: D:\Reps\PETS
  purpose: >
    Guitar-focused local reference and composition support project with a legacy
    static-web runtime, a pywebview shell, and a curated in-repo AI development layer.

layer_summary:
  canonical:
    description: Project identity, workflow truth, structure, and documentation.
  runtime:
    description: Files that currently execute or directly support the active app.
  adapter:
    description: Cursor and Claude development guidance and synchronization files.
  generated:
    description: Rebuildable outputs and packaging artifacts.
  reference:
    description: Historical or saved-page materials not used by the active runtime.
  disposable:
    description: Build and packaging output safe to regenerate.

entries:
  - path: README.md
    layer: canonical
    status: authoritative
    role: overview
    description: Project entry point and source-of-truth overview.
  - path: MANIFEST.md
    layer: canonical
    status: authoritative
    role: identity
    description: Identity, principles, scope, risks, and AI development rules.
  - path: STRUCTURE.md
    layer: canonical
    status: authoritative
    role: repository-structure
    description: Canonical layer model for the repository.
  - path: AGENTS.md
    layer: canonical
    status: authoritative
    role: agent-guidance
    description: Primary editable guide for agent workflows.
  - path: CLAUDE.md
    layer: generated
    status: mirror
    role: agent-guidance
    description: Mirror generated from AGENTS.md for Claude-style workflows.
    generated_from:
      - AGENTS.md
      - scripts/sync_docs.py
  - path: PETS.code-workspace
    layer: canonical
    status: authoritative
    role: workspace
    description: Primary IDE workspace definition.
  - path: .gitignore
    layer: canonical
    status: authoritative
    role: workspace-control
    description: Clean-baseline ignore rules for build, cache, and reference artifacts.

  - path: .github/workflows/ci.yml
    layer: canonical
    status: authoritative
    role: ci-workflow
    description: GitHub Actions workflow; QA change gate plus Playwright E2E on Ubuntu.

  - path: phrygian_app.py
    layer: runtime
    status: authoritative
    role: shell
    description: pywebview launcher; interactive POLYPHONIA_MODE (offline vs assist), URL poly_mode query, runtime set_poly_mode from UI, OpenAI js_api (chat, session key, get_openai_connection, openai_ping, dialog md).
    depends_on:
      - index.html
  - path: polyphonia_runtime/
    layer: runtime
    status: authoritative-helper
    role: python-package
    description: Focused runtime helper modules extracted from phrygian_app.py to reduce shell coupling without changing the pywebview surface.
    depends_on:
      - phrygian_app.py
  - path: build_index.py
    layer: runtime
    status: authoritative
    role: build-helper
    description: HTML assembly; writes index.html, run_polyphonia.bat/.ps1, on Windows creates Desktop Polyphonia.lnk.
    depends_on:
      - guitar_template.html
      - piano_template.html
      - assets/_piano_html.txt
      - assets/pets-bg.png
  - path: run_polyphonia.bat
    layer: runtime
    status: authoritative-runtime-output
    role: launcher-script
    description: Windows cmd launcher; regenerated by build_index.py; runs python phrygian_app.py from repo root.
    depends_on:
      - build_index.py
      - phrygian_app.py
  - path: run_polyphonia.ps1
    layer: runtime
    status: authoritative-runtime-output
    role: launcher-script
    description: PowerShell launcher; regenerated by build_index.py.
    depends_on:
      - build_index.py
      - phrygian_app.py
  - path: index.html
    layer: runtime
    status: authoritative-runtime-output
    role: ui-entry
    description: Active runnable page loaded by the shell.
    depends_on:
      - assets/all_instruments.js
      - assets/chords.data.min.js
      - assets/scales.data.min.js
      - assets/jquery.min.js
      - assets/note.class.min.js
      - assets/chord.class.min.js
      - assets/scale.class.min.js
      - assets/pageMeta.class.min.js
      - assets/instrumentOptions.class.min.js
      - assets/scalesPage.min.js
      - assets/scalesStringed.class.min.js
      - assets/keyPositionPiano.class.min.js
      - assets/styles.min.css
      - assets/instrument_stringed.min.css
      - assets/instrument_options.min.css
      - assets/scales_info.min.css
      - assets/pets-bg.png
      - assets/polyphonia_ui.js
  - path: assets/polyphonia_ui.js
    layer: runtime
    status: authoritative
    role: ui-addon
    description: Assist panel, settings connections UX, layout presets, string visibility, fingering hints, MusicXML snapshot export, window.polyphonia bridge hooks.
    depends_on:
      - assets/jquery.min.js
  - path: polyphonia_sessions/dialogs/
    layer: runtime
    status: workspace-gitignored
    role: assist-dialog-md
    description: Daily Markdown Assist logs; headings User / System (UI) / GPT (OpenAI) / GPT (ошибка); written by phrygian_app.append_assist_dialog_md; not committed.
    depends_on:
      - phrygian_app.py
  - path: riff_contract/
    layer: runtime
    status: authoritative
    role: python-package
    description: JSON Schema validation and optional saves under gitignored polyphonia_sessions/ (pytest and tooling).
    depends_on:
      - docs/schemas/riff-fragment-v0.schema.json
  - path: docs/schemas/riff-fragment-v0.schema.json
    layer: canonical
    status: authoritative
    role: json-schema
    description: Riff fragment contract schema v0 for Polyphonia assist persistence.
  - path: qa/examples/riff-fragment-v0.example.json
    layer: canonical
    status: authoritative
    role: qa-example
    description: Example riff fragment JSON aligned with riff-fragment-v0 schema.
  - path: docs/dev-notes/ai-framework-reaper-spike.md
    layer: canonical
    status: authoritative
    role: dev-note
    description: Reuse vs reject notes for local C:\ai-framework-reaper; external tree is not repository SOT.
  - path: docs/dev-notes/openai-assist-bridge.md
    layer: canonical
    status: authoritative
    role: dev-note
    description: Optional OpenAI GPT bridge via pywebview js_api; env key, session RAM key, consent for context.
  - path: docs/dev-notes/assist-llm-login-ux.md
    layer: canonical
    status: authoritative
    role: dev-note
    description: GPT vs Claude login UX, current behavior, risks, and implementation option table.
    depends_on:
      - docs/dev-notes/openai-assist-bridge.md
      - docs/dev-notes/claude-terminal-launcher.md
  - path: guitar_template.html
    layer: runtime
    status: authoritative-build-input
    role: template
    description: Template source for stringed UI form controls.
  - path: piano_template.html
    layer: runtime
    status: authoritative-build-input
    role: template
    description: Template source for piano UI assembly.
  - path: polyphonia.spec
    layer: runtime
    status: authoritative
    role: packaging
    description: PyInstaller spec for the Polyphonia desktop build; produces windowed polyphonia.exe (PETS repo).
    depends_on:
      - phrygian_app.py
      - index.html
      - assets/

