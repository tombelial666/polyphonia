  - path: docs/templates/technical-decomposition-template.md
    layer: canonical
    status: authoritative
    role: task-template
    description: Technical decomposition template.
  - path: docs/templates/code-review-template.md
    layer: canonical
    status: authoritative
    role: task-template
    description: Code review template.
  - path: docs/changelogs/README.md
    layer: canonical
    status: authoritative
    role: changelog-policy
    description: Changelog convention note.

  - path: tasks/
    layer: canonical
    status: authoritative
    role: task-root
    description: Task and execution note root.
  - path: tasks/_template.md
    layer: canonical
    status: authoritative
    role: task-template
    description: Default task template.

  - path: .cursor/
    layer: adapter
    status: authoritative-adapter
    role: cursor-layer
    description: Primary AI tooling layer.
  - path: .cursor/hooks.json
    layer: adapter
    status: authoritative-adapter
    role: hooks
    description: Post-edit sync hooks.
  - path: .cursor/rules/
    layer: adapter
    status: authoritative-adapter
    role: rules
    description: PETS-specific Cursor rules.
  - path: .cursor/skills/
    layer: adapter
    status: authoritative-adapter
    role: skills
    description: Curated skills for discovery, planning, implementation, review, docs, and desktop migration.
  - path: .cursor/agents/
    layer: adapter
    status: authoritative-adapter
    role: agents
    description: Curated reviewer and updater agents.
  - path: .cursor/commands/
    layer: adapter
    status: authoritative-adapter
    role: command-helpers
    description: Minimal command prompts for common workflows.

  - path: .claude/
    layer: generated
    status: active-mirror
    role: claude-layer
    description: Mirrored adapter layer generated from .cursor.
    generated_from:
      - .cursor/
      - scripts/sync_configs.py

  - path: scripts/sync_docs.py
    layer: adapter
    status: authoritative-helper
    role: sync-script
    description: Mirrors AGENTS.md into CLAUDE.md.
  - path: scripts/sync_configs.py
    layer: adapter
    status: authoritative-helper
    role: sync-script
    description: Mirrors .cursor into .claude, excluding hooks.json.

