    role: active-build-cache
    description: Build cache for the active packaging path.
  - path: build/A Phrygian Dominant/
    layer: generated
    status: disposable-legacy
    role: legacy-build-cache
    description: Build cache for the legacy packaging path.
  - path: dist/
    layer: generated
    status: disposable
    role: packaging-output
    description: Expected packaged output directory.

  - path: A Phrygian Dominant.html
    layer: reference
    status: non-core
    role: saved-page
    description: Browser-saved page snapshot.
  - path: A Phrygian Dominant.spec
    layer: reference
    status: non-core
    role: legacy-packaging
    description: Legacy spec oriented around the saved-page path.
  - path: A Phrygian Dominant_files/
    layer: reference
    status: non-core
    role: saved-page-bundle
    description: Saved-page resource bundle with duplicates, widgets, and browser-save artifacts.

legacy_notes:
  - The active runtime path is phrygian_app.py -> index.html -> assets/.
  - The cleanest readable instrument source is all_instruments.js, but runtime still uses duplicated per-instrument snapshots.
  - Saved-page artifacts can easily mislead agents and should never be treated as product truth.
