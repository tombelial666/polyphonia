version: 1
project:
  name: PETS
  root: D:\Reps\PETS
  purpose: >
    Guitar-focused local reference and composition support project with a legacy
    static-web runtime, a pywebview shell, and a curated in-repo AI development layer.

layer_summary:
  canonical:
    description: Project identity, workflow truth, structure, and documentation.
  runtime:
    description: Files that currently execute or directly support the active app.
  adapter:
    description: Cursor and Claude development guidance and synchronization files.
  generated:
    description: Rebuildable outputs and packaging artifacts.
  reference:
    description: Historical or saved-page materials not used by the active runtime.
  disposable:
    description: Build and packaging output safe to regenerate.

entries:
  - path: README.md
    layer: canonical
    status: authoritative
    role: overview
    description: Project entry point and source-of-truth overview.
  - path: MANIFEST.md
    layer: canonical
    status: authoritative
    role: identity
    description: Identity, principles, scope, risks, and AI development rules.
  - path: STRUCTURE.md
    layer: canonical
    status: authoritative
    role: repository-structure
    description: Canonical layer model for the repository.
  - path: AGENTS.md
    layer: canonical
    status: authoritative
    role: agent-guidance
    description: Primary editable guide for agent workflows.
  - path: CLAUDE.md
    layer: generated
    status: mirror
    role: agent-guidance
    description: Mirror generated from AGENTS.md for Claude-style workflows.
    generated_from:
      - AGENTS.md
      - scripts/sync_docs.py
  - path: PETS.code-workspace
    layer: canonical
    status: authoritative
    role: workspace
    description: Primary IDE workspace definition.
  - path: .gitignore
    layer: canonical
    status: authoritative
    role: workspace-control
    description: Clean-baseline ignore rules for build, cache, and reference artifacts.

  - path: phrygian_app.py
    layer: runtime
    status: authoritative
    role: shell
    description: pywebview launcher for the current local desktop runtime.
    depends_on:
      - index.html
  - path: build_index.py
    layer: runtime
    status: authoritative
    role: build-helper
    description: Current HTML assembly helper; writes index.html.
    depends_on:
      - guitar_template.html
      - piano_template.html
      - assets/_piano_html.txt
    notes:
      - contains absolute paths and is therefore fragile
  - path: index.html
    layer: runtime
    status: authoritative-runtime-output
    role: ui-entry
    description: Active runnable page loaded by the shell.
    depends_on:
      - assets/all_instruments.js
      - assets/chords.data.min.js
      - assets/scales.data.min.js
      - assets/jquery.min.js
      - assets/note.class.min.js
      - assets/chord.class.min.js
      - assets/scale.class.min.js
      - assets/pageMeta.class.min.js
      - assets/instrumentOptions.class.min.js
      - assets/scalesPage.min.js
      - assets/scalesStringed.class.min.js
      - assets/keyPositionPiano.class.min.js
      - assets/styles.min.css
      - assets/instrument_stringed.min.css
      - assets/instrument_options.min.css
      - assets/scales_info.min.css
  - path: guitar_template.html
    layer: runtime
    status: authoritative-build-input
    role: template
    description: Template source for stringed UI form controls.
  - path: piano_template.html
    layer: runtime
    status: authoritative-build-input
    role: template
    description: Template source for piano UI assembly.
  - path: ChordRocks.spec
    layer: runtime
    status: authoritative
    role: packaging
    description: Current PyInstaller spec for the active runtime path.
    depends_on:
      - phrygian_app.py
      - index.html
      - assets/

  - path: docs/
    layer: canonical
    status: authoritative
    role: documentation-root
    description: Canonical documentation tree.
  - path: docs/architecture.md
    layer: canonical
    status: authoritative
    role: architecture
    description: Current runtime and near-term target architecture.
  - path: docs/desktop-transition-roadmap.md
    layer: canonical
    status: authoritative
    role: roadmap
    description: Transition roadmap from pywebview to a future desktop shell.
  - path: docs/documentation-standard.md
    layer: canonical
    status: authoritative
    role: doc-policy
    description: Documentation maintenance rules.
  - path: docs/dev-workflow/commands-reference.md
    layer: canonical
    status: authoritative
    role: workflow
    description: Minimal adapted AI workflow.
  - path: docs/ai-foundation-bootstrap.md
    layer: canonical
    status: authoritative
    role: donor-analysis
    description: Donor inventory and scored decisions.
  - path: docs/repo-index.md
    layer: canonical
    status: authoritative
    role: repo-summary
    description: Short repository overview.
  - path: docs/legacy-index.md
    layer: canonical
    status: authoritative
    role: legacy-index
    description: Full root-level legacy map.
  - path: docs/legacy-assets-index.md
    layer: canonical
    status: authoritative
    role: assets-index
    description: Detailed asset-layer map.
  - path: docs/legacy-reference-index.md
    layer: canonical
    status: authoritative
    role: reference-index
    description: Detailed map of build, dist, and saved-page artifacts.
  - path: docs/adr/README.md
    layer: canonical
    status: authoritative
    role: adr-index
    description: ADR index and usage note.
  - path: docs/adr/TEMPLATE.md
    layer: canonical
    status: authoritative
    role: adr-template
